{% extends "base.html" %}
{% block title %}Login — NaijaRomance{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card auth-card-sm">
    <div class="auth-header">
      <div class="auth-logo">💚</div>
      <h1>Welcome Back</h1>
      <p>Log in to continue your journey</p>
    </div>

    <form method="POST" action="{{ url_for('login') }}" class="auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
      <div class="form-group">
        <label for="identifier">Username or Email</label>
        <input type="text" id="identifier" name="identifier" class="form-control"
               placeholder="Username or email address" required autofocus/>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-eye">
          <input type="password" id="password" name="password" class="form-control"
                 placeholder="Your password" required/>
          <button type="button" class="eye-btn" onclick="togglePw('password')"><i class="fas fa-eye"></i></button>
        </div>
      </div>
      <div class="form-check">
        <input type="checkbox" id="remember" name="remember" class="check-input"/>
        <label for="remember">Remember me</label>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
        <i class="fas fa-sign-in-alt"></i> Log In
      </button>
    </form>

    <div class="text-center" style="margin-top:.8rem">
      <a href="{{ url_for('forgot_password') }}" class="text-muted" style="font-size:.88rem">
        <i class="fas fa-lock"></i> Forgot your password?
      </a>
    </div>

    <p class="auth-switch">Don't have an account? <a href="{{ url_for('register') }}">Join free today</a></p>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function togglePw(id) {
  const el = document.getElementById(id);
  el.type = el.type === 'password' ? 'text' : 'password';
}

// Track failed attempts in sessionStorage for UX feedback
(function() {
  const form    = document.querySelector('.auth-form');
  const btn     = document.getElementById('loginBtn');
  const key     = 'nr_login_fails';
  const fails   = parseInt(sessionStorage.getItem(key) || '0');

  if (fails >= 3 && btn) {
    const hint = document.createElement('p');
    hint.style.cssText = 'font-size:.8rem;color:#856404;text-align:center;margin-top:.5rem';
    hint.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Multiple failed attempts. Check your details or <a href="/forgot-password">reset your password</a>.';
    btn.parentNode.insertBefore(hint, btn.nextSibling);
  }

  // Check if the page loaded with a 'danger' flash (failed login)
  const hasDanger = document.querySelector('.alert-danger');
  if (hasDanger) {
    sessionStorage.setItem(key, fails + 1);
  } else if (!hasDanger && !document.querySelector('[name=identifier]').value) {
    // Clean state on fresh load without error
    sessionStorage.removeItem(key);
  }
})();
</script>
{% endblock %}
