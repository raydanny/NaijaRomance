<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>500 — Server Error · NaijaRomance</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/favicon_32.png') }}"/>
</head>
<body>
<div class="error-page">
  <div class="error-content">
    <a href="{{ url_for('index') }}" class="error-brand">💚 NaijaRomance</a>
    <div class="error-emoji">😔</div>
    <h1 class="error-code">500</h1>
    <h2>Something went wrong</h2>
    <p>We hit a snag on our end. Please try again in a moment — we're on it.</p>
    <div class="error-actions">
      <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg">
        <i class="fas fa-home"></i> Go Home
      </a>
      <button onclick="history.back()" class="btn btn-outline btn-lg">
        <i class="fas fa-arrow-left"></i> Go Back
      </button>
    </div>
  </div>
</div>
</body>
</html>
